<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Clone</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Instagram</div>
        <div class="search-bar">Instagram <input type="text" placeholder="Search"></div>
        <div class="user-actions">
            <button class="profile-button">Profile</button>
            <button class="activity-button">Activity</button>
            <button class="settings-button">Settings</button>
        </div>
    </header>
    <main>
        <div class="post">
            <div class="post-header">
                <img src="image.avif" class="profile-pic" alt="Profile Picture">
                <div class="username">rupesh</div>
            </div>
            <img src="image2.jpg" class="post-image" alt="post image">
            <div class="post-actions">
                <i class="fa-regular fa-heart"></i>
                <button class="like-button">Like</button>
                <i class="fa-regular fa-comment"></i>
                <button class="comment-button">Comment</button>
                <i class="fa-solid fa-share"></i>
                <button class="share-button">Share</button>
                <div class="post-description">
                <strong>rupesh.b798</strong><br> Beauty of india
            
            </div>
        </div>        
    </main>
    <footer>
        <div class="footer-links">
            <a href="#">Home</a>
            <a href="#">Explore</a>
            <a href="#">Profile</a>
        </div>
    </footer>
       
       
    
</body>
</html>
